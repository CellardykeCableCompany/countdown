<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5c247;
  --tile:#ffffff;
  --tile-top:#ffffff;
  --tile-bot:#f3f3f1;
  --ink:#343434;
  --w:clamp(34px,12.5vw,100px);
  --h:calc(var(--w) * 1.42);
  --fs:calc(var(--h) * 0.72);
  --r:clamp(6px,1.6vw,10px);
  --t:0.34s;               /* half-flip duration */
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  min-height:100%;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:clamp(16px,5vw,48px);
  font-family:'Arimo','Helvetica Neue',Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.board{display:flex;align-items:flex-start;justify-content:center;gap:clamp(14px,4vw,36px);flex-wrap:wrap}
.group{display:flex;flex-direction:column;align-items:center}
.pair{display:flex;gap:clamp(4px,1.2vw,7px)}
.label{
  margin-top:clamp(10px,2.4vw,16px);
  color:#fff;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  font-size:clamp(10px,2.4vw,15px);
}

/* one flip digit */
.tile{
  position:relative;width:var(--w);height:var(--h);
  perspective:calc(var(--h) * 3.4);
  filter:drop-shadow(0 5px 9px rgba(120,80,0,.22));
}
.half,.flap{
  position:absolute;left:0;width:100%;height:50%;overflow:hidden;
}
/* the number lives full-height inside each half so the two halves join seamlessly */
.num{
  position:absolute;left:0;width:100%;text-align:center;
  height:var(--h);line-height:var(--h);font-size:var(--fs);
  color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;
}
.half.top,.flap.fold{top:0;border-radius:var(--r) var(--r) 0 0;background:var(--tile-top)}
.half.bot,.flap.unfold{bottom:0;border-radius:0 0 var(--r) var(--r);background:var(--tile-bot)}
.half.top .num,.flap.fold .num{top:0}
.half.bot .num,.flap.unfold .num{top:-100%}

/* shading overlay that sells the 3-D fold */
.shade{position:absolute;inset:0;opacity:0;pointer-events:none;border-radius:inherit}
.flap.fold .shade{background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.45) 100%)}
.flap.unfold .shade{background:linear-gradient(0deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.5) 100%)}

.flap{z-index:2;backface-visibility:hidden;transform-style:preserve-3d}
.flap.fold{transform-origin:50% 100%;transform:rotateX(0deg)}
.flap.unfold{transform-origin:50% 0%;transform:rotateX(90deg)}
.flap.fold.run{animation:fold var(--t) cubic-bezier(.36,0,.66,-0.05) forwards}
.flap.unfold.run{animation:unfold var(--t) cubic-bezier(.34,1.05,.64,1) var(--t) forwards}
.flap.fold.run .shade{animation:foldShade var(--t) ease-in forwards}
.flap.unfold.run .shade{animation:unfoldShade var(--t) ease-out var(--t) forwards}
@keyframes fold{from{transform:rotateX(0deg)}to{transform:rotateX(-90deg)}}
@keyframes unfold{from{transform:rotateX(90deg)}to{transform:rotateX(0deg)}}
@keyframes foldShade{from{opacity:0}to{opacity:1}}
@keyframes unfoldShade{from{opacity:1}to{opacity:0}}

/* centre seam + hinge pins */
.tile::after{
  content:"";position:absolute;left:0;right:0;top:50%;height:2px;
  transform:translateY(-1px);background:rgba(0,0,0,.16);z-index:5;border-radius:2px;
}
.pin{position:absolute;top:50%;width:6px;height:11px;background:#3a3a3a;
  transform:translateY(-50%);z-index:6;border-radius:2px}
.pin.l{left:-3px}
.pin.r{right:-3px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  :root{--t:0.16s}
}
</style>
</head>
<body>
<div class="board" id="board" aria-hidden="true"></div>
<p class="sr" id="sr"></p>

<script>
(function(){

  function Digit(){
    var el=document.createElement('div');
    el.className='tile';
    el.innerHTML=
      '<div class="half top"><span class="num">0</span></div>'+
      '<div class="half bot"><span class="num">0</span></div>'+
      '<div class="flap fold"><span class="num">0</span><div class="shade"></div></div>'+
      '<div class="flap unfold"><span class="num">0</span><div class="shade"></div></div>'+
      '<i class="pin l"></i><i class="pin r"></i>';
    this.el=el;
    this.topN=el.querySelector('.top .num');
    this.botN=el.querySelector('.bot .num');
    this.fold=el.querySelector('.fold'); this.foldN=this.fold.querySelector('.num');
    this.unfold=el.querySelector('.unfold'); this.unfoldN=this.unfold.querySelector('.num');
    this.cur=null;
  }
  Digit.prototype.set=function(v){
    v=String(v);
    if(v===this.cur) return;
    var old=this.cur; this.cur=v;
    if(old===null){
      this.topN.textContent=v; this.botN.textContent=v;
      this.foldN.textContent=v; this.unfoldN.textContent=v;
      return;
    }
    this.topN.textContent=v;      // revealed once the top leaf folds away
    this.botN.textContent=old;    // stays old until the incoming leaf lands
    this.foldN.textContent=old;
    this.unfoldN.textContent=v;
    this.fold.classList.remove('run');
    this.unfold.classList.remove('run');
    void this.el.offsetWidth;     // reflow so the animation restarts
    this.fold.classList.add('run');
    this.unfold.classList.add('run');
    var self=this;
    var done=function(){ self.botN.textContent=v; self.unfold.removeEventListener('animationend',done); };
    this.unfold.addEventListener('animationend',done);
  };

  var UNITS=[['Hours',2],['Minutes',2],['Seconds',2]];
  var board=document.getElementById('board');
  var digits={};
  UNITS.forEach(function(u){
    var key=u[0].toLowerCase(), n=u[1];
    var g=document.createElement('div'); g.className='group';
    var pair=document.createElement('div'); pair.className='pair';
    digits[key]=[];
    for(var i=0;i<n;i++){ var d=new Digit(); digits[key].push(d); pair.appendChild(d.el); }
    var lab=document.createElement('div'); lab.className='label'; lab.textContent=u[0];
    g.appendChild(pair); g.appendChild(lab); board.appendChild(g);
  });

  function p2(n){n=Math.max(0,Math.floor(n));return (n<10?'0':'')+n;}
  function show(key,val){
    var s=p2(val), arr=digits[key];
    for(var i=0;i<arr.length;i++) arr[i].set(s[i]);
  }

  var sr=document.getElementById('sr');
  // 24-hour clock in the visitor's own local time
  function tick(){
    var now=new Date();
    var hrs=now.getHours(), mins=now.getMinutes(), secs=now.getSeconds();
    show('hours',hrs); show('minutes',mins); show('seconds',secs);
    sr.textContent='The time is '+p2(hrs)+':'+p2(mins)+'.';
  }
  // re-sync to the top of each second so the flip lands on the real tick
  function loop(){
    tick();
    setTimeout(loop,1000-(Date.now()%1000)+15);
  }
  loop();
})();
</script>
</body>
</html>
